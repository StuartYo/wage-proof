[workspace]
members = ["wage-proof-cw"]
resolver = "2"

[workspace.dependencies]
# Chain runs wasmd 0.43 / wasmvm 1.4.1 -> CosmWasm 1.x only (no 2.x).
cosmwasm-std = { version = "~1.5", default-features = false, features = ["iterator", "stargate"] }
cosmwasm-schema = "~1.5"
cw-storage-plus = "=1.2.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true
