<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工資證據確認或異議｜本機示範</title>
<style>
  :root { --ink:#16181d; --mute:#5b6270; --line:#d9dce3; --bg:#f6f7f9; --card:#fff; --acc:#1f5eff; --ok:#147a3d; --warn:#a15c00; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.6 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color:var(--ink); background:var(--bg); }
  .synth { background:#fff4d6; color:#5a4100; font-size:13px; padding:6px 16px; border-bottom:1px solid #f0d58a; }
  header, main, footer { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--mute); margin: 0; }
  .roles { display:flex; gap:8px; margin: 16px 0; }
  .roles button { flex:1; padding:10px; border:1px solid var(--line); background:var(--card); border-radius:8px; cursor:pointer; font-size:15px; }
  .roles button[aria-pressed="true"] { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); font-weight:600; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { font-size:16px; margin:0 0 8px; }
  label { display:block; font-size:13px; color:var(--mute); margin-top:8px; }
  input { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font: inherit; }
  button.act { margin-top:10px; padding:8px 14px; border-radius:6px; border:1px solid var(--acc); background:var(--acc); color:#fff; cursor:pointer; }
  button.act.secondary { background:#fff; color:var(--acc); }
  button.act:disabled { opacity:.4; cursor:not-allowed; }
  code { font-size:12px; word-break: break-all; }
  table { width:100%; border-collapse: collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align: top; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid currentColor; }
  .s1 { color: var(--warn); } .s2 { color: var(--ok); } .s3 { color: var(--bad); } .s4 { color: var(--mute); }
  #log { font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; max-height: 160px; overflow:auto; background:#f1f2f5; padding:8px; border-radius:6px; }
  footer { color: var(--mute); font-size: 13px; }
</style>
</head>
<body>
<div class="synth" data-synthetic="header">示範用合成資料 Synthetic demo data：頁面上的人名、公司、金額全部虛構。</div>
<header>
  <h1>工資證據：確認或異議</h1>
  <p class="sub">鏈上只記報告指紋、地址、時間、狀態。報告本身留在本機。目前連的是本機模擬鏈（不是測試網）。</p>
  <div class="roles" role="group" aria-label="切換角色">
    <button id="roleWorker" aria-pressed="true">我是勞工</button>
    <button id="roleEmployer" aria-pressed="false">我是雇主</button>
  </div>
  <p class="sub">目前身分地址：<code id="me">連線中…</code></p>
</header>
<main>
  <div class="grid">
    <section class="card" id="workerCard">
      <h2>勞工：登記比對報告的指紋</h2>
      <div class="synth" data-synthetic="card" style="border-radius:6px">示範用合成資料 Synthetic demo data</div>
      <p id="reportSummary" class="sub">讀取示範報告…</p>
      <label>報告指紋（SHA-256，由瀏覽器自己算）</label>
      <code id="reportHash">—</code>
      <label for="deadline">雇主回應期限（秒，示範可調短，最少 30）</label>
      <input id="deadline" type="number" min="30" value="60">
      <button class="act" id="submitBtn">登記上鏈</button>
    </section>
    <section class="card">
      <h2>只讀 ME ID：這個地址是不是通過驗證的真人</h2>
      <label for="meidAddr">地址（me1… 或 0x…），查的是 ME 測試網</label>
      <input id="meidAddr" placeholder="me1...">
      <button class="act secondary" id="meidBtn">查詢</button>
      <p id="meidOut" class="sub"></p>
    </section>
  </div>
  <section class="card" style="margin-top:16px">
    <h2>紀錄</h2>
    <table>
      <thead><tr><th>#</th><th>狀態</th><th>期限</th><th>報告指紋</th><th>動作</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5">尚無紀錄</td></tr></tbody>
    </table>
    <button class="act secondary" id="ffBtn" title="只在本機模擬鏈有效">快轉 60 秒（本機鏈專用）</button>
  </section>
  <section class="card" style="margin-top:16px">
    <h2>操作紀錄</h2>
    <div id="log"></div>
  </section>
</main>
<footer>
  <div class="synth" data-synthetic="footer">示範用合成資料 Synthetic demo data</div>
  <p>原型：只連本機模擬鏈。不構成法律意見，鏈上紀錄的法律效力未經查證。</p>
</footer>
<script src="/vendor/ethers.umd.min.js"></script>
<script src="/local.js"></script>
</body>
</html>
