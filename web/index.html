<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="薪水少算了，送一張補薪單給老闆。老闆在 ME Network 上補發或提出異議，每一步都有交易可查。">
<title>補薪單｜工資對帳存證・ME Network 測試網</title>
<link rel="icon" href="data:,">
<link rel="preload" href="/fonts/NotoSansTC-subset.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Noto Sans TC Sub"; src: url("/fonts/NotoSansTC-subset.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --stage: #0e1f05; --stage-2: #172d0c; --stage-line: #2a4417; --stage-ink: #e8ebe6; --stage-mute: #a9b5a0;
  --ink-deep: #163300; --canvas: #ffffff; --soft: #e8ebe6; --ink: #0e0f0c; --body: #454745; --mute: #6b6d6a;
  --primary: #9fe870; --primary-active: #cdffad; --primary-pale: #e2f6d5; --worker: #c5edab; --accent: #ffc091;
  --waiting: #ffd11a; --waiting-ink: #4a3b1c; --paid: #2ead4b; --paid-deep: #054d28;
  --disputed: #d03238; --disputed-deep: #a72027; --disputed-pale: #fdecec; --expired: #868685;
  --font: "Noto Sans TC Sub", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --r-phone: 24px; --r-sm: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--stage); color: var(--stage-ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; }
.mono, code { font-family: var(--mono); font-variant-numeric: tabular-nums; }
code { font-size: .9em; word-break: break-all; }
.i { width: 18px; height: 18px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid #38c8ff; outline-offset: 2px; }

/* ---------- top bar: product + guide ---------- */
.bar { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; padding: 14px 24px 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 17px; font-weight: 800; color: #fff; white-space: nowrap; }
.brand span { font-size: 14px; color: var(--stage-mute); white-space: nowrap; }
.guide { display: flex; align-items: center; gap: 4px; list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--stage-mute); }
.guide li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.guide li + li::before { content: ""; width: 14px; height: 1.5px; background: var(--stage-line); margin: 0 6px 0 2px; }
.guide .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--mono); box-shadow: inset 0 0 0 1.5px var(--stage-mute); }
.guide .done .n { background: var(--stage-line); box-shadow: none; color: var(--stage-ink); }
.guide .done .n .i { width: 13px; height: 13px; }
.guide .on { color: #fff; font-weight: 700; }
.guide .on .n { background: #fff; color: var(--ink); box-shadow: none; }
.guide button { background: none; border: 0; padding: 0; min-height: 32px; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: underline; text-underline-offset: 3px; }
.now { grid-column: 1 / -1; text-align: center; font-size: 16px; font-weight: 600; color: #fff; min-height: 24px; margin: 0 0 12px; }
.now b { color: var(--primary); font-weight: 800; }

/* ---------- mobile role switch ---------- */
.switch { display: none; }

/* ---------- stage ---------- */
.stage { display: grid; grid-template-columns: 390px 390px; column-gap: 32px; justify-content: center; padding: 4px 24px 0; }
.side-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--stage-mute); margin: 0 0 8px 4px; }
.chip { width: 10px; height: 10px; border-radius: 3px; background: var(--worker); }
.chip.b { background: var(--accent); }
.phone { background: var(--canvas); color: var(--ink); border-radius: var(--r-phone); min-height: 604px; flex: 1 1 auto; display: flex; flex-direction: column; padding: 20px 20px 18px; }
.side { display: flex; flex-direction: column; }
.phone.arrive { animation: arrive 600ms ease-out; }
@keyframes arrive { 0% { box-shadow: 0 0 0 0 var(--accent); } 25% { box-shadow: 0 0 0 5px var(--accent); } 100% { box-shadow: 0 0 0 0 rgba(255, 192, 145, 0); } }

/* ---------- inside a phone ---------- */
.eyebrow { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--body); }
.eyebrow .i { width: 16px; height: 16px; }
.title { font-size: 20px; font-weight: 800; line-height: 1.3; margin-top: 6px; }
.amt { font-size: 56px; font-weight: 900; line-height: 1; letter-spacing: -.02em; margin: 10px 0 8px; font-variant-numeric: tabular-nums; }
.amt small { font-size: 26px; font-weight: 800; letter-spacing: 0; margin-right: 2px; }
.amt.md { font-size: 40px; margin: 6px 0 4px; }
.amt.md small { font-size: 20px; }
.why { font-size: 16px; color: var(--body); }
.bars { display: grid; grid-template-columns: 48px 1fr auto; gap: 6px 10px; align-items: center; margin-top: 14px; font-size: 14px; color: var(--body); }
.bars svg { display: block; width: 100%; height: 12px; }
.bars .v { font-family: var(--mono); font-size: 13px; color: var(--ink); text-align: right; white-space: nowrap; }
.field { margin-top: 14px; }
.lab { display: block; font-size: 13px; font-weight: 600; color: var(--body); margin-bottom: 6px; }
.to { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--soft); border-radius: var(--r-sm); padding: 8px 10px 8px 14px; min-height: 48px; }
.to b { font-weight: 600; font-size: 15px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; border-radius: 9999px; padding: 3px 10px 3px 7px; white-space: nowrap; }
.badge .i { width: 15px; height: 15px; }
.badge.ok { background: var(--primary-pale); color: var(--paid-deep); }
.badge.no { background: var(--disputed-pale); color: var(--disputed-deep); }
.badge.wait { background: var(--soft); color: var(--body); }
.link { background: none; border: 0; padding: 0; min-height: 44px; color: var(--ink); text-decoration: underline; text-decoration-color: #b9bdb6; text-underline-offset: 4px; font-size: 14px; cursor: pointer; text-align: left; }
.link:hover { text-decoration-color: var(--ink); }
.link.c { align-self: center; text-align: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 9999px; padding: 3px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: grid; place-items: center; min-height: 44px; border-radius: 9999px; font-size: 15px; font-weight: 600; color: var(--body); }
.seg input:checked + span { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(14, 15, 12, .14); }
.seg input:focus-visible + span { outline: 3px solid #38c8ff; }
.fine { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: var(--mute); margin-top: 4px; }
.fine .i { width: 15px; height: 15px; margin-top: 2px; }
.note { font-size: 13px; color: var(--mute); margin-top: 10px; overflow-wrap: anywhere; }
.fine.c { justify-content: center; text-align: center; margin-top: 8px; }
.grow { flex: 1 1 auto; min-height: 14px; }
.warnline { display: flex; align-items: center; gap: 6px; color: var(--disputed-deep); font-weight: 700; font-size: 15px; margin-bottom: 10px; }
.err { color: var(--disputed-deep); font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.hint { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: var(--r-sm); padding: 12px 14px; font-size: 15px; }

.btn { width: 100%; min-height: 52px; border: 0; border-radius: 9999px; font: 800 17px/1.2 var(--font); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform 100ms ease-out, background-color 150ms ease-out; padding: 0 20px; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--primary); color: var(--ink-deep); }
.btn.primary:hover:not(:disabled) { background: var(--primary-active); }
.btn:disabled { background: var(--soft); color: var(--body); cursor: progress; }
.btn.second { background: var(--soft); color: var(--ink); }
.btn.second:hover { background: #dde1da; }
.btn.outline { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); width: auto; min-height: 48px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* sending steps + tracker */
.steps, .track { list-style: none; margin: 18px 0 0; padding: 0; }
.steps li { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 16px; color: var(--mute); }
.steps li.done, .steps li.now { color: var(--ink); }
.steps li.now { font-weight: 700; }
.dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 2px #c9cdc6; }
.dot .i { width: 14px; height: 14px; }
.done > .dot { background: var(--ink); color: #fff; box-shadow: none; }
.now > .dot { box-shadow: none; }
.track li { display: grid; grid-template-columns: 28px 1fr; column-gap: 12px; position: relative; padding-bottom: 18px; }
.track li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; background: var(--soft); }
.track li.done:not(:last-child)::before { background: var(--ink); }
.track .dot { width: 28px; height: 28px; }
.track .dot .i { width: 16px; height: 16px; }
.track .wait > .dot, .track li.wait .dot { background: var(--waiting); color: var(--waiting-ink); box-shadow: none; }
.track li.late .dot { background: var(--soft); color: var(--body); box-shadow: none; }
.track b { display: block; font-size: 17px; font-weight: 800; line-height: 28px; }
.track li.todo b { color: var(--mute); font-weight: 600; }
.track .sub { display: block; font-size: 14px; color: var(--body); }

/* receipt */
.receipt { border-top: 1px solid var(--soft); margin-top: 14px; }
.receipt summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 15px; cursor: pointer; list-style: none; }
.receipt summary::-webkit-details-marker { display: none; }
.receipt summary .i { transition: transform 150ms ease-out; }
.receipt[open] summary .i { transform: rotate(180deg); }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 12px; font-size: 14px; margin: 0 0 6px; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv a { display: inline-flex; align-items: center; gap: 3px; min-height: 24px; padding: 12px 0; margin: -12px 0; }
.kv a .i { width: 14px; height: 14px; }

/* results */
.big { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff; margin-top: 4px; }
.big .i { width: 30px; height: 30px; }
.big.paid { background: var(--paid); }
.big.disputed { background: var(--disputed); }
.big.expired { background: var(--soft); color: var(--body); }
.res { font-size: 28px; font-weight: 900; line-height: 1.25; margin-top: 14px; }
.bal { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; background: var(--soft); border-radius: var(--r-sm); padding: 12px 14px; margin-top: 16px; }
.bal .lab { margin: 0; }
.bal .mono { font-size: 15px; text-align: right; white-space: nowrap; }
.bal .mono b { font-weight: 700; color: var(--paid-deep); }
.bal .plus { grid-column: 1 / -1; font-size: 13px; color: var(--body); }
.ext { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: 14px; font-weight: 600; }
.ext .i { width: 15px; height: 15px; }
.quote { margin: 14px 0 0; padding: 12px 14px; background: var(--soft); border-radius: var(--r-sm); font-size: 16px; }
.alert { background: var(--disputed-pale); border-radius: var(--r-sm); padding: 16px; margin-top: 14px; color: #4d0d10; }
.alert h3 { display: flex; gap: 8px; align-items: center; color: var(--disputed-deep); font-size: 18px; font-weight: 800; line-height: 1.35; }
.alert h3 .i { width: 22px; height: 22px; }
.alert p { margin-top: 8px; font-size: 15px; }
.alert .ext { color: var(--disputed-deep); }

/* boss */
.btop { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--soft); margin-bottom: 16px; }
.btop .name { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--body); min-width: 0; }
.btop .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; color: var(--mute); }
.empty .i { width: 40px; height: 40px; stroke-width: 1.5; margin-bottom: 6px; color: #b9bdb6; }
.empty p:first-of-type { font-size: 17px; font-weight: 700; color: var(--body); }
.due { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--waiting-ink); background: #fff6cc; border-radius: 9999px; padding: 4px 12px 4px 8px; align-self: flex-start; margin-top: 12px; }
.due .i { width: 16px; height: 16px; }
.due .mono { font-weight: 700; }
.lines { margin: 16px 0 0; display: grid; gap: 0; }
.lines div { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--soft); font-size: 15px; }
.lines div:last-child { border-bottom: 1px solid var(--soft); }
.lines dt { color: var(--body); }
.lines dd { margin: 0; font-family: var(--mono); font-size: 14px; }
.state { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-top: 14px; }
.dispute { display: grid; gap: 8px; margin-top: 8px; }
.dispute label { font-size: 13px; font-weight: 600; color: var(--body); }
.dispute input { min-height: 48px; border: 1.5px solid var(--ink); border-radius: var(--r-sm); padding: 10px 14px; font-size: 16px; background: #fff; width: 100%; }
.dispute input[aria-invalid="true"] { border-color: var(--disputed); }
.dispute .row { display: flex; align-items: center; gap: 16px; }

/* ---------- evidence strip ---------- */
.evidence { grid-column: 1 / -1; margin-top: 20px; }
.evhead { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 18px; padding-bottom: 8px; }
.evhead h2 { font-size: 15px; font-weight: 800; color: #fff; }
.evhead .meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--stage-mute); }
.evhead .meta b { color: var(--stage-ink); font-family: var(--mono); font-weight: 600; }
.evhead .total { margin-left: auto; }
.icon-btn { background: none; border: 0; color: var(--stage-ink); min-width: 32px; min-height: 32px; border-radius: 8px; display: inline-grid; place-items: center; cursor: pointer; padding: 0 4px; font-size: 13px; }
.icon-btn:hover { background: var(--stage-2); }
.icon-btn .i { width: 15px; height: 15px; }
.evhead a { display: inline-flex; align-items: center; gap: 3px; color: var(--stage-ink); }
.evhead a .i, .evrow a .i { width: 14px; height: 14px; }
.evrow { display: grid; grid-template-columns: 70px 54px 1fr 112px 104px; gap: 12px; align-items: center; min-height: 44px; padding: 6px 8px; border-top: 1px solid var(--stage-line); font-size: 14px; }
.evrow.hd { min-height: 28px; font-size: 12.5px; font-weight: 600; color: var(--stage-mute); border-top: 0; padding-top: 0; padding-bottom: 4px; }
.evrow .t, .evrow .h { font-family: var(--mono); font-size: 13px; color: var(--stage-mute); }
.evrow .h { text-align: right; }
.evrow .who { font-weight: 700; color: var(--stage-ink); }
.evrow .what b { font-weight: 700; color: #fff; }
.evrow .what .s { color: var(--stage-mute); margin-left: 8px; }
.evrow .what .mine { display: inline-block; font-size: 12px; font-weight: 700; color: var(--ink-deep); background: var(--worker); border-radius: 6px; padding: 0 6px; margin-left: 8px; vertical-align: 1px; }
.evrow a { display: inline-flex; align-items: center; gap: 4px; color: var(--stage-ink); font-family: var(--mono); font-size: 13px; min-height: 32px; }
.evrow.rej .what b { color: #ffb3b5; }
.evrow.rej a { font-family: var(--font); }
.evrow.pend .what b { display: inline-flex; align-items: center; gap: 8px; }
.evrow.pend .spin { width: 14px; height: 14px; border-width: 2px; }
.evrow.fresh { animation: fresh 1.2s ease-out; }
@keyframes fresh { 0%, 40% { background: #2f4d1a; } 100% { background: rgba(47, 77, 26, 0); } }
.evnote { padding: 12px 8px; color: var(--stage-mute); font-size: 14px; border-top: 1px solid var(--stage-line); }
.foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 13px; color: var(--stage-mute); padding: 12px 8px 40px; border-top: 1px solid var(--stage-line); }
.foot a { color: var(--stage-ink); min-height: 32px; display: inline-flex; align-items: center; gap: 3px; }
.foot a .i { width: 14px; height: 14px; }
.foot details { color: var(--stage-ink); }
.foot summary { cursor: pointer; min-height: 32px; display: inline-flex; align-items: center; text-decoration: underline; text-underline-offset: 3px; }
.foot ul { margin: 6px 0 4px; padding-left: 20px; color: var(--stage-mute); max-width: 720px; }
.dock { display: none; }

@media (prefers-reduced-motion: reduce) {
  .phone.arrive, .evrow.fresh { animation: none; }
  .phone.arrive { box-shadow: 0 0 0 3px var(--accent); }
  .spin { animation-duration: 2.4s; }
  .btn { transition: none; }
}

/* ---------- one phone at a time below 1024 ---------- */
@media (max-width: 1023px) {
  .bar { padding: 12px 14px 8px; gap: 8px; }
  .brand span { display: none; }
  .switch { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; background: var(--stage); padding: 8px 14px 0; }
  .switch .who-now { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; }
  .switch .roles { display: grid; grid-template-columns: 1fr 1fr; background: var(--stage-2); border-radius: 9999px; padding: 4px; }
  .switch .roles button { min-height: 44px; border: 0; border-radius: 9999px; background: none; color: var(--stage-ink); font-weight: 700; font-size: 16px; cursor: pointer; }
  .switch .roles button[aria-selected="true"] { background: #fff; color: var(--ink); }
  .switch .rolebar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--worker); }
  body[data-view="boss"] .switch .rolebar { background: var(--accent); }
  .guide { order: 3; width: 100%; font-size: 13px; }
  .guide .long { display: none; }
  .now { text-align: left; font-size: 15px; margin-bottom: 10px; }
  .stage { grid-template-columns: minmax(0, 440px); padding: 10px 12px 0; }
  .side-label { display: none; }
  .phone { min-height: 0; height: auto; padding: 18px 16px 16px; }
  body[data-view="worker"] .side.b, body[data-view="boss"] .side.w { display: none; }
  .evidence { margin-top: 18px; }
  .evhead .total { margin-left: 0; }
  .evrow.hd { display: none; }
  .evrow { grid-template-columns: auto 1fr auto; gap: 2px 10px; padding: 10px 4px; }
  .evrow .t { grid-row: 1; grid-column: 1; }
  .evrow .who { grid-row: 1; grid-column: 2; }
  .evrow .x { grid-row: 1; grid-column: 3; }
  .evrow .what { grid-row: 2; grid-column: 1 / -1; }
  .evrow .what .s { display: block; margin-left: 0; }
  .evrow .h { grid-row: 3; grid-column: 1 / -1; text-align: left; }
  .guide button { min-height: 44px; }
  .evrow a, .evhead a, .foot a, .foot summary, .icon-btn { min-height: 44px; min-width: 44px; }
  .dock { display: block; position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 6; }
  .dock[hidden] { display: none; }
  body.has-dock { padding-bottom: 84px; }
}
@media (min-width: 1024px) {
  .guide .short { display: none; }
}
</style>
</head>
<body data-view="worker">
<header class="bar">
  <div class="brand"><h1>工資對帳存證</h1><span>薪水少算了，請老闆在鏈上補發</span></div>
  <ol class="guide" id="guide" aria-label="示範步驟"></ol>
</header>
<div class="switch" id="switch">
  <span class="who-now" id="whoNow">現在：勞工</span>
  <div class="roles" role="tablist" aria-label="切換手機">
    <button type="button" role="tab" data-act="view" data-view="worker" aria-selected="true">勞工</button>
    <button type="button" role="tab" data-act="view" data-view="boss" aria-selected="false">老闆</button>
  </div>
  <span class="rolebar" aria-hidden="true"></span>
</div>
<main class="stage">
  <p class="now" id="now" aria-live="polite">讀取 ME Network 測試網…</p>
  <section class="side w" aria-labelledby="wLabel">
